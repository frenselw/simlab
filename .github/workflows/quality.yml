name: Quality

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run package:all
      - run: npm run test:browser:position-time
      - run: npm run test:browser:linear-motion
      - run: npm run test:browser:mobile-touch
      - run: npm run test:browser:driving
