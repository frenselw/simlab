<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>誰提供向心力：受力分析與圓心方向</title><link rel="icon" href="data:,">
  <link rel="stylesheet" href="../shared/styles.css"><link rel="stylesheet" href="styles.css">
  <script defer src="../shared/scorm.js"></script><script defer src="../shared/activity-flow.js"></script><script defer src="../shared/fullscreen.js"></script>
  <script defer src="model.js"></script><script defer src="math-glyphs.js"></script><script defer src="notation.js"></script><script defer src="scene.js"></script><script defer src="persistence.js"></script><script defer src="scoring.js"></script><script defer src="ui-runtime.js"></script><script defer src="main.js"></script>
</head>
<body>
<main id="app" class="sim-app" data-sim-fullscreen-target>
  <header class="sim-header" data-sim-fullscreen>
    <div class="heading"><h1>誰提供向心力</h1><p id="status">受力分析與圓心方向</p></div>
    <nav id="caseNav" aria-label="六個情境"></nav>
    <select id="compactNav" aria-label="選擇情境"></select>
    <button id="checkButton" type="button">檢查答案</button>
  </header>
  <section id="stage" class="sim-stage" aria-label="運動情境與受力分析圖">
    <div class="side-strip" aria-hidden="true"></div>
    <div id="diagram" class="diagram"><svg id="diagramSvg" role="img" aria-label="研究對象及學生所畫的實際受力圖"></svg><button id="originHandle" class="force-handle origin-handle" type="button" aria-label="從研究對象拖出所選的力" hidden></button><button id="forceHandle" class="force-handle" type="button" aria-label="拖動選定力的箭尖；方向鍵可微調" hidden></button></div>
    <div class="side-strip" aria-hidden="true"></div>
    <div id="preview" class="preview" hidden><span>箭尖放大 ×2</span><svg id="previewSvg" role="img" aria-label="正在調整的箭尖及力標籤"></svg><svg id="previewOverview" class="preview-overview" aria-hidden="true"></svg></div>
  </section>
  <section id="controlPanel" class="sim-panel" aria-label="操作與作答面板">
    <p id="notice" role="status" hidden></p><button id="saveRetry" type="button" hidden>重試保存</button>
    <section id="resultPanel" hidden><h2 id="resultTitle"></h2><p id="scoreText"></p><button id="retryFinal" type="button" hidden>重試提交</button></section>
    <section id="learningPanel">
      <h2 id="caseTitle"></h2><p id="caseNote"></p>
      <div class="button-row"><button id="analyseButton" class="primary" type="button">畫受力圖</button><button id="sceneButton" type="button">暫停運動</button></div>
      <div id="motionControls"><label for="motionPosition">拖動觀察運動位置</label><input id="motionPosition" type="range" min="0" max="9999" value="0"><p id="motionMessage" class="hint" role="status"></p></div>
      <div id="answerArea">
      <fieldset><legend>選出指向圓心的箭頭</legend><p id="directionHint" class="hint"></p><div id="directionChoices" class="direction-pad" role="group" aria-label="圓心相對物體的方向"></div><p class="direction-key"><span aria-hidden="true">┄➤</span> 藍色虛線只標方向，不是一個力。</p></fieldset>
      <section id="forceControls"><h3>親手畫出實際受力</h3><p class="hint">按選一種力，再從物件中心拖出箭頭。拖箭尖可修改；箭長只供示意。</p><p id="notationHint" class="hint"></p>
        <div id="forcePalette" class="force-palette" role="group" aria-label="選擇力的種類與來源"></div><p id="drawInstruction" role="status" class="draw-instruction"></p>
        <button id="addForce" class="keyboard-add" type="button">加入後用方向按鈕設定</button>
        <div id="forceList" aria-label="已加入的力"></div>
        <div id="directionTools" hidden><p>選定力：<span id="selectedForceLabel"></span></p><label class="kind-change">更改力的種類 <select id="kindSelect" aria-label="選定力的種類"></select></label><div id="arrowDirections" class="direction-pad" role="group" aria-label="調整選定力的方向"></div><p class="hint">方向鍵左右微調 1°，Shift 加速至 5°；上下調整示意箭長。</p></div>
        <div class="button-row"><button id="deleteForce" type="button">刪除選定力</button><button id="clearDrawing" type="button">清空本題受力圖</button></div>
      </section>
      <fieldset><legend>哪些實際作用力或分量提供向心力？</legend><div id="relationChoices"></div></fieldset>
      <fieldset id="conceptField"><legend>共同概念：向心力是甚麼？</legend><div id="conceptChoices"></div></fieldset>
      <button id="clearPage" type="button">清除本題全部答案</button>
      </div>
    </section>
    <section id="checkPanel" hidden><h2>檢查目前作答</h2><p>空白及部分答案都可以提交；未答部分得 0 分。提交後答案會鎖定。</p><div id="checkSummary"></div><div class="button-row"><button id="returnEdit" type="button">返回修改</button><button id="submitButton" class="primary" type="button">提交目前答案</button></div></section>
    <section id="feedback" hidden><h2>學生圖與參考圖</h2><p>圖中僅列實際作用力；徑向合力在下方另行說明，不當作額外外力。</p><div id="feedbackList"></div></section>
  </section>
</main>
</body>
</html>
