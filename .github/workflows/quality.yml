name: Quality
on:
  push:
  pull_request:
permissions:
  contents: read
  actions: read
concurrency:
  group: quality-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verification:
    uses: ./.github/workflows/quality-run.yml
    with:
      # P2 preserves full coverage while recording selection decisions.
      full: true
      shadow: true
  check:
    if: always()
    needs: verification
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require complete verification
        env:
          RESULT: ${{ needs.verification.result }}
        run: test "$RESULT" = success
