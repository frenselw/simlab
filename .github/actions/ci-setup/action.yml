name: SimLab CI environment
description: Install and record verified Node and optional browser environment
inputs:
  browser:
    description: Install sandboxed Chrome, CJK fonts and native display
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '22.23.3'
        cache: npm
    - uses: browser-actions/setup-chrome@v2
      if: inputs.browser == 'true'
      id: chrome
      with:
        chrome-version: '154.0.8037.92'
    - name: Install CJK browser fonts
      if: inputs.browser == 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y fonts-noto-cjk
        echo "CHROME_PATH=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
    - shell: bash
      run: npm ci
    - name: Record and verify environment
      shell: bash
      env:
        WITH_BROWSER: ${{ inputs.browser }}
      run: |
        if [ "$WITH_BROWSER" = true ]; then
          xvfb-run -a node tools/ci-environment.js
        else
          node tools/ci-environment.js --node-only
        fi
    - name: Verify sandboxed Chrome startup
      if: inputs.browser == 'true'
      shell: bash
      run: bash tools/setup-ci-chrome.sh
