<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>重心探究實驗室</title>
  <link rel="stylesheet" href="../shared/styles.css"><link rel="stylesheet" href="styles.css">
  <script src="../shared/scorm.js" defer></script><script src="../shared/activity-flow.js" defer></script>
  <script src="generator.js" defer></script><script src="model.js" defer></script><script src="scoring.js" defer></script>
  <script src="persistence.js" defer></script><script src="ui-policy.js" defer></script><script src="main.js" defer></script>
</head>
<body>
  <main id="app" class="lab-app">
    <header class="app-header"><div><h1>重心探究實驗室</h1><p id="phaseBadge">第 1/3 部分</p></div><progress id="progress" max="4" value="1" aria-label="活動進度"></progress></header>
    <div class="workspace">
      <section id="stage" class="stage" aria-labelledby="stageTitle">
        <h2 id="stageTitle" class="sr-only">實驗圖台</h2>
        <svg id="svgStage" viewBox="0 0 700 460" role="img" aria-label="重心實驗互動圖台"></svg>
        <canvas id="solidCanvas" width="700" height="460" aria-label="可旋轉的均勻立體及候選點"></canvas>
        <div id="directLayer" class="direct-layer"></div>
        <div id="preview" class="preview is-hidden" aria-hidden="true"></div>
      </section>
      <aside id="controlPanel" class="control-panel" aria-label="實驗控制">
        <section id="technical" class="panel-card is-hidden"><h2>技術狀態</h2><p id="technicalMessage"></p><button id="technicalRetry">重新載入</button></section>
        <section id="part1Controls" class="panel-card"><h2>一維承托</h2><p>移動承托點並放手，利用跌落方向找出水平的中性平衡。</p>
          <div class="formula" role="math" aria-label="重心位置等於各質量乘位置的總和除以總質量"><var>x<sub class="upright-subscript">cm</sub></var><span aria-hidden="true"> = </span><span class="fraction" aria-hidden="true"><span>Σ<var>m<sub>i</sub></var><var>x<sub>i</sub></var></span><span>Σ<var>m<sub>i</sub></var></span></span></div>
          <p id="part1Status" class="notice"></p><div class="button-row"><button data-p1-move="-0.01">向左</button><button data-p1-move="0.01">向右</button><button id="testSupport" class="primary-button">測試承托</button></div>
          <div id="part1MarkTools" class="is-hidden"><button id="placePart1Mark">放置重心標註</button><div class="button-row"><button data-p1-mark="-0.01">−</button><button data-p1-mark="0.01">＋</button></div><button id="confirmPart1" class="primary-button">確認第一部分</button></div>
        </section>
        <section id="part2Controls" class="panel-card is-hidden"><h2>二維懸掛與畫線</h2><p>選擇不同小孔掛上牆釘，待平板停止後沿鉛垂線畫線。</p><p id="part2Status" class="notice"></p>
          <div id="holeButtons" class="button-row" role="group" aria-label="選擇小孔"></div><button id="hangHole">將選定小孔掛上牆釘</button><button id="traceLine">鍵盤等價：沿鉛垂線畫線</button>
          <div class="button-row"><button data-rotate="-5">逆時針 5°</button><button data-rotate="5">順時針 5°</button></div>
          <div id="part2MarkTools" class="is-hidden"><button id="placePart2Mark">放置標註</button><div class="mark-grid"><span></span><button data-p2-mark="0,-1">上</button><span></span><button data-p2-mark="-1,0">左</button><button data-p2-mark="0,1">下</button><button data-p2-mark="1,0">右</button></div><button id="confirmPart2" class="primary-button">確認第二部分</button></div>
        </section>
        <section id="part3Controls" class="panel-card is-hidden"><h2>三維對稱立體</h2><p id="solidSummary">旋轉立體，從不同方向觀察候選點。</p><p id="part3Status" class="notice"></p>
          <div class="button-row"><button data-view="-150,0">向左看</button><button data-view="150,0">向右看</button><button data-view="0,-150">向上看</button><button data-view="0,150">向下看</button></div>
          <fieldset id="candidateRadios"><legend>選擇重心候選點</legend></fieldset><button id="confirmCandidate">確認選擇</button><button id="confirmPart3" class="primary-button">完成並檢查</button>
        </section>
        <section id="checkControls" class="panel-card is-hidden"><h2>提交前檢查</h2><div id="checkSummary"></div><div class="button-row"><button data-redo="1">重做第一部分</button><button data-redo="2">重做第二部分</button><button data-redo="3">重做第三部分</button></div><button id="submit" class="primary-button">提交結果</button></section>
        <section id="reviewControls" class="panel-card is-hidden"><h2>已鎖定的結果</h2><div id="reviewSummary"></div><button id="retrySubmission" class="is-hidden">重試目前提交</button></section>
        <p id="liveRegion" class="sr-only" aria-live="polite"></p>
      </aside>
    </div>
  </main>
</body>
</html>
